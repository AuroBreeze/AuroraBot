# version: "3.8"

services:
  aurorabot:
    container_name: Bot
    image: mlikiowa/napcat-docker:latest

    ports:
      - "3001:3001"
      - "6099:6099"
    restart: unless-stopped

  app:
    build: .
    image: aurora-bot:latest
    container_name: AuroraBot
    restart: always
    depends_on:
      - aurorabot
